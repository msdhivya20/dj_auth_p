{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Complete</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body{
            margin:0;
            font-family:Segoe UI,sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .auth-card{
            background:white;
            width:450px;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
            text-align:center;
        }

        h2{
            color:#1e3a8a;
        }

        a{
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="auth-card">

    <h2>Password Updated Successfully</h2>

    <p>
        Your password has been reset successfully.
    </p>

    <br>

    <a href="{% url 'login' %}">
        Login Now
    </a>

</div>

</body>
</html>
