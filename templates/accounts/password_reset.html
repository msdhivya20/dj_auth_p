{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>

        body{
            margin:0;
            font-family:Segoe UI, sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .auth-card{
            background:white;
            width:420px;
            padding:35px;
            border-radius:12px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#6b7280;
            font-size:14px;
            margin-bottom:25px;
        }

        input[type="email"]{
            width:100%;
            padding:12px;
            border:1px solid #d1d5db;
            border-radius:6px;
            box-sizing:border-box;
            margin-top:8px;
        }

        label{
            font-weight:500;
            color:#374151;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back-link{
            text-align:center;
            margin-top:20px;
        }

        .back-link a{
            text-decoration:none;
            color:#2563eb;
            font-size:14px;
        }

        .back-link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="auth-card">

    <h2>Forgot Password</h2>

    <p class="subtitle">
        Enter your registered email address and we'll send a password reset link.
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="back-link">

        <a href="{% url 'login' %}">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
