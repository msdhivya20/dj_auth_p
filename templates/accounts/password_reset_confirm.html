{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Set New Password</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        body{
            margin:0;
            font-family:Segoe UI,sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .auth-card{
            background:white;
            width:450px;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 3px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:#1e3a8a;
        }

        input{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }
    </style>

</head>

<body>

<div class="auth-card">

    <h2>Set New Password</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Update Password
        </button>

    </form>

</div>

</body>
</html>
